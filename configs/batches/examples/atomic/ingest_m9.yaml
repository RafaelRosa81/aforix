# ============================================================
# Atomic example: ingest M9
# ============================================================
#
# Objetivo:
#   Ingesta archivos MAT de RiverSurveyor Live como tablas M9 Summary y Points.
#
# IMPORTANTE:
#   M9 está implementado para MAT compatibles exportados por RiverSurveyor Live.
#   Cada MAT produce una transecta independiente; no se promedian pasadas.
#
# Requisitos:
#   - Archivos raw en data/raw/M9/
#   - Configuración M9 habilitada en main.yaml
#
# Outputs esperados:
#   runs/ingest_m9/<timestamp>/outputs/raw_canonical/
#
# Probar con:
#   aforix batch check -b configs/batches/examples/atomic/ingest_m9.yaml
#   Revisar la guía del flujo y limitaciones antes de exportar al SIH:
#   docs/M9_PROCESSING_GUIDE.md

version: 1

batch:
  id: atomic_ingest_m9
  name: Atomic ingest M9
  description: Ingesta una transecta M9 desde MAT de RiverSurveyor Live.

project:
  main_config: configs/examples/main.yaml

execution:
  output_dir: runs/batch
  create_manifest: true
  stop_on_error: true

variables:
  main_config: configs/examples/main.yaml

steps:
  - id: ingest_m9
    command: ingest.m9
    enabled: true
    params:
      config: ${main_config}
